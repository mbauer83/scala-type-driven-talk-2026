name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"
          cache-local-packages: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build the deck and the notes sidecar
        run: make all

      - name: Prose lint and timing
        run: make check

      - name: Build the presenting artifacts
        run: |
          make talk-pptx
          make talk-presenter

      - name: Package the presenter
        run: zip -qr presenter.zip presenter

      - uses: actions/upload-artifact@v4
        with:
          name: talk-${{ github.sha }}
          if-no-files-found: error
          path: |
            talk.pdf
            talk.pptx
            presenter.zip
