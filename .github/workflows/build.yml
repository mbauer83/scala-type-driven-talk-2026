name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"
          cache-local-packages: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: |
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build the deck and the notes sidecar
        run: make all

      - name: Prose lint and timing
        run: make check

      - name: Build the presenting artifacts
        run: |
          make talk-pptx
          make talk-presenter

      - name: Package the presenter
        run: zip -qr presenter.zip presenter

      - uses: actions/upload-artifact@v4
        with:
          name: talk-${{ github.sha }}
          if-no-files-found: error
          path: |
            talk.pdf
            talk.pptx
            presenter.zip
